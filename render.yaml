services:
  - type: web
    name: weather-truck-routing-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 60 config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: ROUTING_PROVIDER
        value: mapbox
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "1800"
